<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투두리스트 (To-Do List)</title>
  <link rel="stylesheet" href="style.css">
  <!-- 구글 폰트 (Pretendard 대체용 Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 헤더 영역 -->
    <header class="app-header">
      <div class="header-content">
        <h1 class="app-title">📝 My To-Do List</h1>
        <p class="app-date" id="currentDate">2026년 11월 5일</p>
      </div>
      <!-- 통계 및 진행률 -->
      <div class="progress-box">
        <div class="progress-info">
          <span>진행 상황</span>
          <span id="progressText">0 / 0 완료 (0%)</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
      </div>
    </header>

    <!-- 입력창 영역 -->
    <div class="input-card">
      <form id="todoForm">
        <input 
          type="text" 
          id="todoInput" 
          placeholder="새로운 할 일을 입력하세요..." 
          autocomplete="off"
          maxlength="100"
        />
        <button type="submit" id="addBtn" class="primary-btn">
          <span>추가</span>
        </button>
      </form>
    </div>

    <!-- 필터 및 제어 영역 -->
    <div class="controls-bar">
      <div class="filter-tabs">
        <button type="button" class="filter-btn active" data-filter="all">전체</button>
        <button type="button" class="filter-btn" data-filter="active">진행 중</button>
        <button type="button" class="filter-btn" data-filter="completed">완료됨</button>
      </div>
      <button type="button" id="clearCompletedBtn" class="text-danger-btn">완료 항목 삭제</button>
    </div>

    <!-- 할 일 목록 영역 -->
    <main class="list-section">
      <ul id="todoList" class="todo-list">
        <!-- 자바스크립트로 동적 렌더링 -->
      </ul>

      <!-- 빈 목록 표시 -->
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">✨</div>
        <p class="empty-text">등록된 할 일이 없습니다.</p>
        <span class="empty-subtext">새로운 할 일을 추가하고 하루를 시작해보세요!</span>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
